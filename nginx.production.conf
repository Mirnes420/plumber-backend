server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    root /var/www/yourdomain/current/dist;
    index index.html;

    # Only serve the production build output
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block any hidden files or config leakage
    location ~ (^|/)\.[^/]+ {
        deny all;
        return 404;
    }

    # Block sensitive project files and source directories
    location ~* \.(json|lock|env|git|md|yml|yaml)$ {
        deny all;
        return 404;
    }

    location ~* ^/(package\.json|package-lock\.json|\.env|\.git|comp/|src/|assets/) {
        deny all;
        return 404;
    }

    location = /robots.txt {
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        try_files /sitemap.xml =404;
    }
}
